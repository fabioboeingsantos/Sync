# Identificador do ambiente de desenvolvimento do Supabase CLI.
project_id = "visionchef"

[auth]
# O Auth local acompanha o mínimo exigido no cadastro e na redefinição pelo VisionChef.
minimum_password_length = 6

[functions.login-usuario]
# O endpoint recebe a senha antes que exista uma sessão. O Supabase Auth valida a credencial.
verify_jwt = false
entrypoint = "./functions/login-usuario/index.js"

[functions.limitar-autenticacao]
# A assinatura HMAC do backend protege a função sem exigir JWT do navegador.
verify_jwt = false
entrypoint = "./functions/limitar-autenticacao/index.js"

[functions.verificacao-email]
# A confirmação facultativa é chamada somente pela API da Vercel com assinatura HMAC.
verify_jwt = false
entrypoint = "./functions/verificacao-email/index.js"
