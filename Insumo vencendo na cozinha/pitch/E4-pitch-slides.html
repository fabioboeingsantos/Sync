<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitch E4 — VisionChef · Time SYNC</title>
  <link rel="icon" type="image/png" href="../abertura/imagens/LogoOficial.png" />
  <style>
    /* =========================================================================
       SLIDES DO PITCH (E4) — TIME SYNC · VISIONCHEF
       - Identidade visual alinhada à Paleta Oficial Aço Inox (style-guide.md)
       - Tipografia Arial em alto contraste para retroprojetor e exportação PDF 16:9
       ========================================================================= */
    :root {
      --font-main: Arial, Helvetica, sans-serif;
      --aco-primaria: #0f4c5c;
      --aco-secundaria: #2a7f8e;
      --aco-destaque: #a8d5dd;
      --aco-fundo: #f4f6f7;
      --aco-alerta: #b3261e;
    }

    [data-theme="dark"] {
      --bg-outer: #041015;
      --slide-bg: linear-gradient(155deg, #081c24 0%, #0d2b36 55%, #071920 100%);
      --slide-bg-print: #091f28;
      --card-bg: rgba(15, 76, 92, 0.28);
      --card-bg-strong: rgba(15, 76, 92, 0.48);
      --text-primary: #ffffff;
      --text-soft: #e6f3f6;
      --text-muted: #a8d5dd;
      --border: rgba(168, 213, 221, 0.28);
      --tag-bg: rgba(168, 213, 221, 0.16);
      --tag-color: #a8d5dd;
      --bar-primaria: #2a7f8e;
      --bar-destaque: #a8d5dd;
      --bar-alerta: #f87171;
      --btn-bg: linear-gradient(160deg, rgba(42, 127, 142, 0.9) 0%, rgba(15, 76, 92, 0.96) 100%);
      --btn-text: #ffffff;
      --btn-sec-bg: rgba(255, 255, 255, 0.1);
      --btn-sec-text: #e6f3f6;
    }

    [data-theme="light"] {
      --bg-outer: #dce6e9;
      --slide-bg: #f4f6f7;
      --slide-bg-print: #f4f6f7;
      --card-bg: #ffffff;
      --card-bg-strong: #e6f3f6;
      --text-primary: #0f4c5c;
      --text-soft: #182327;
      --text-muted: #2a7f8e;
      --border: #b8d4da;
      --tag-bg: #a8d5dd;
      --tag-color: #182327;
      --bar-primaria: #0f4c5c;
      --bar-destaque: #2a7f8e;
      --bar-alerta: #b3261e;
      --btn-bg: linear-gradient(160deg, #2a7f8e 0%, #0f4c5c 100%);
      --btn-text: #ffffff;
      --btn-sec-bg: #ffffff;
      --btn-sec-text: #0f4c5c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      background: var(--slide-bg-print);
      color: var(--text-primary);
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* Tela cheia real sem bordas externas desperdiçadas — pensado para auditório com 20 fileiras */
    .deck-shell {
      width: 100vw;
      height: 100vh;
      background: var(--slide-bg);
      border-radius: 0;
      border: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(14px, 1.6vw, 24px) clamp(20px, 2.2vw, 34px);
      overflow: hidden;
    }

    @media (max-width: 960px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .deck-shell { width: 100%; height: auto; min-height: 100vh; overflow: visible; }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .deck-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(0.95rem, 1.15vw, 1.2rem);
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .deck-brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      display: block;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    /* Em tela cheia no projetor, oculta botões auxiliares para maximizar área de leitura */
    .deck-shell:fullscreen .top-actions,
    .deck-shell:-webkit-full-screen .top-actions {
      opacity: 0.12;
      transition: opacity 0.2s ease;
    }
    .deck-shell:fullscreen .top-actions:hover,
    .deck-shell:-webkit-full-screen .top-actions:hover {
      opacity: 1;
    }

    .tool-btn {
      background: var(--btn-sec-bg);
      border: 1px solid var(--border);
      color: var(--btn-sec-text);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tool-btn:hover { filter: brightness(1.08); }

    .slide-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(14px, 1.8vh, 24px);
      animation: fadeSlide 0.22s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-tag {
      display: inline-block;
      align-self: flex-start;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: clamp(0.95rem, 1.22vw, 1.25rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: var(--tag-bg);
      color: var(--tag-color);
    }

    /* Tipografia ampliada e nítida para leitura a até 20 fileiras de distância em retroprojetor */
    .slide-title {
      font-size: clamp(2.35rem, 4.3vw, 4.35rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .slide-lead {
      font-size: clamp(1.32rem, 2.05vw, 2.15rem);
      line-height: 1.36;
      color: var(--text-soft);
      max-width: 100%;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(16px, 1.8vw, 26px);
      align-items: stretch;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.32fr);
      gap: clamp(16px, 1.8vw, 24px);
      align-items: stretch;
    }

    .video-frame {
      background: var(--card-bg-strong);
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .video-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(15, 76, 92, 0.86);
      color: #e6f3f6;
      font-size: clamp(0.86rem, 1.05vw, 1.05rem);
      font-weight: 700;
    }

    .video-bar button {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(168, 213, 221, 0.55);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .video-frame video {
      width: 100%;
      flex: 1;
      min-height: 280px;
      max-height: 58vh;
      object-fit: contain;
      background: #041015;
      display: block;
    }

    .demo-fallback {
      display: none;
    }

    .demo-fallback.ativo {
      display: flex;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 1.6vw, 24px);
      align-items: stretch;
    }

    @media (max-width: 820px) {
      .grid-2, .grid-3, .demo-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-left: 7px solid var(--bar-primaria);
      border-radius: 14px;
      padding: clamp(18px, 2vw, 28px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card.destaque {
      background: var(--card-bg-strong);
      border-left-color: var(--bar-destaque);
    }

    .card.alerta {
      border-left-color: var(--bar-alerta);
    }

    .card h3 {
      font-size: clamp(1.3rem, 1.85vw, 1.9rem);
      line-height: 1.2;
      color: var(--text-primary);
    }

    .card p, .card li {
      font-size: clamp(1.12rem, 1.52vw, 1.56rem);
      line-height: 1.38;
      color: var(--text-soft);
    }

    .card ul {
      padding-left: 24px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .hero-cover {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: center;
    }

    .cover-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 26px;
      border-radius: 18px;
      border: 1.5px solid var(--border);
      background: var(--card-bg-strong);
      text-align: center;
    }

    /* Recorte exato do símbolo pictórico do VisionChef (chapéu de chef + olho + barras) */
    .vc-slide-pictorica {
      position: relative;
      width: clamp(132px, 13vw, 190px);
      aspect-ratio: 10 / 6.7;
      overflow: hidden;
      background: #ffffff;
      border-radius: 16px;
      border: 2px solid rgba(168, 213, 221, 0.72);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.24);
    }

    .vc-slide-pictorica img {
      position: absolute;
      top: -2%;
      left: 50%;
      width: 178%;
      max-width: none;
      height: auto;
      transform: translateX(-50%);
      display: block;
    }

    .cover-badge strong {
      font-size: clamp(1.3rem, 1.7vw, 1.7rem);
      color: var(--text-primary);
    }

    .cover-badge span {
      font-size: clamp(1rem, 1.2vw, 1.2rem);
      font-weight: 700;
      color: var(--text-muted);
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid rgba(168, 213, 221, 0.45);
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(1rem, 1.2vw, 1.2rem);
    }

    .cta-link.sec {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border-color: var(--border);
    }

    .cta-link:hover { filter: brightness(1.08); }

    .closing-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: center;
    }

    .qr-box {
      background: #ffffff;
      color: #0f4c5c;
      border: 3px solid #2a7f8e;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      min-width: 248px;
    }

    .qr-box img {
      width: clamp(190px, 16vw, 240px);
      height: clamp(190px, 16vw, 240px);
      display: block;
      border-radius: 6px;
    }

    .qr-box strong { font-size: 1.15rem; color: #0f4c5c; }
    .qr-box span { font-size: 0.96rem; font-weight: 700; color: #2a7f8e; word-break: break-all; }

    .nota-rodape {
      font-size: clamp(1rem, 1.24vw, 1.26rem);
      line-height: 1.38;
      color: var(--text-muted);
    }

    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .footer-info {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-right: auto;
    }

    .nav-btn {
      padding: 6px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Modo impressão 16:9 limpo sem bordas largas para exportar PDF da E5 (Ctrl+P -> Salvar como PDF) */
    .print-deck { display: none; }

    @media print {
      @page { size: 16in 9in; margin: 0; }
      body { background: #ffffff; padding: 0; display: block; width: auto; height: auto; overflow: visible; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .deck-shell { display: none !important; }
      .print-deck { display: block; }
      /* Na exportação PDF da E5, exibe o cartão com link no lugar do vídeo interativo. */
      .print-deck .video-frame { display: none !important; }
      .print-deck .demo-fallback { display: flex !important; }
      .print-slide {
        width: 100vw;
        height: 100vh;
        page-break-after: always;
        background: var(--slide-bg-print);
        color: var(--text-primary);
        padding: 26px 36px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
      }
      .print-slide:last-child { page-break-after: auto; }
    }
  </style>
</head>

    let index = 0;

    function ativarFallbackDemo() {
      const quadro = document.getElementById('demoVideoFrame');
      const reserva = document.getElementById('demoFallback');
      if (quadro) quadro.style.display = 'none';
      if (reserva) reserva.classList.add('ativo');
    }

    function reiniciarDemoVideo() {
      const video = document.getElementById('demoVideo');
      if (!video) return;
      video.currentTime = 0;
      video.play?.().catch(() => {});
    }

    function render() {
      document.getElementById('slideMount').innerHTML = slides[index].html;
      document.getElementById('slideCounter').textContent = `Slide ${index + 1} de ${slides.length} • Setas ← →`;
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === slides.length - 1;
      // Garante que o vídeo do Slide 6 reinicie do 00:00 sempre que o apresentador chegar nele.
      const video = document.getElementById('demoVideo');
      if (video) {
        video.currentTime = 0;
        video.play?.().catch(() => {});
      }
    }

    function buildPrintDeck() {
      const marcaTopo = `<div class="deck-brand" style="margin-bottom: 6px;"><img src="../abertura/imagens/LogoOficial.png" width="40" height="40" alt="" /><span>Time SYNC · VisionChef</span></div>`;
      document.getElementById('printDeck').innerHTML = slides
        .map((s) => `<section class="print-slide">${marcaTopo}${s.html}</section>`)
        .join('');
    }

    function next() { if (index < slides.length - 1) { index += 1; render(); } }
    function prev() { if (index > 0) { index -= 1; render(); } }

    function toggleTheme() {
      const html = document.documentElement;
      const nextTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nextTheme);
      document.getElementById('themeBtn').textContent = nextTheme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
    }

    function toggleFullscreen() {
      const root = document.getElementById('deckRoot');
      if (!document.fullscreenElement) root.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    document.getElementById('prevBtn').addEventListener('click', prev);
    document.getElementById('nextBtn').addEventListener('click', next);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') prev();
      if (e.key.toLowerCase() === 'f') toggleFullscreen();
      if (e.key.toLowerCase() === 't') toggleTheme();
    });

    buildPrintDeck();
    render();
  </script>
