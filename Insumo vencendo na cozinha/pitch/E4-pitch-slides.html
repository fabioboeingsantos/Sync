<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitch E4 — VisionChef · Time SYNC</title>
  <link rel="icon" type="image/png" href="../abertura/imagens/coruja-sync-icone.png" />
  <style>
    /* =========================================================================
       SLIDES DO PITCH (E4) — TIME SYNC · VISIONCHEF
       - Identidade visual alinhada à Paleta Oficial Aço Inox (style-guide.md)
       - Tipografia Arial em alto contraste para retroprojetor e exportação PDF 16:9
       ========================================================================= */
    :root {
      --font-main: Arial, Helvetica, sans-serif;
      --aco-primaria: #0f4c5c;
      --aco-secundaria: #2a7f8e;
      --aco-destaque: #a8d5dd;
      --aco-fundo: #f4f6f7;
      --aco-alerta: #b3261e;
    }

    [data-theme="dark"] {
      --bg-outer: #041015;
      --slide-bg: linear-gradient(155deg, #081c24 0%, #0d2b36 55%, #071920 100%);
      --slide-bg-print: #091f28;
      --card-bg: rgba(15, 76, 92, 0.28);
      --card-bg-strong: rgba(15, 76, 92, 0.48);
      --text-primary: #ffffff;
      --text-soft: #e6f3f6;
      --text-muted: #a8d5dd;
      --border: rgba(168, 213, 221, 0.28);
      --tag-bg: rgba(168, 213, 221, 0.16);
      --tag-color: #a8d5dd;
      --bar-primaria: #2a7f8e;
      --bar-destaque: #a8d5dd;
      --bar-alerta: #f87171;
      --btn-bg: linear-gradient(160deg, rgba(42, 127, 142, 0.9) 0%, rgba(15, 76, 92, 0.96) 100%);
      --btn-text: #ffffff;
      --btn-sec-bg: rgba(255, 255, 255, 0.1);
      --btn-sec-text: #e6f3f6;
    }

    [data-theme="light"] {
      --bg-outer: #dce6e9;
      --slide-bg: #f4f6f7;
      --slide-bg-print: #f4f6f7;
      --card-bg: #ffffff;
      --card-bg-strong: #e6f3f6;
      --text-primary: #0f4c5c;
      --text-soft: #182327;
      --text-muted: #2a7f8e;
      --border: #b8d4da;
      --tag-bg: #a8d5dd;
      --tag-color: #182327;
      --bar-primaria: #0f4c5c;
      --bar-destaque: #2a7f8e;
      --bar-alerta: #b3261e;
      --btn-bg: linear-gradient(160deg, #2a7f8e 0%, #0f4c5c 100%);
      --btn-text: #ffffff;
      --btn-sec-bg: #ffffff;
      --btn-sec-text: #0f4c5c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      background: var(--slide-bg-print);
      color: var(--text-primary);
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* Tela cheia real sem bordas externas desperdiçadas — pensado para auditório com 20 fileiras */
    .deck-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--slide-bg);
      border-radius: 0;
      border: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(14px, 1.6vw, 24px) clamp(20px, 2.2vw, 34px);
      overflow: hidden;
    }

    /* Slide 1: vídeo animado da equipe SYNC ocupando 100% do fundo */
    .deck-shell.is-video-cover {
      background: #050b16;
    }

    .deck-shell.is-video-cover .top-bar,
    .deck-shell.is-video-cover .footer-bar {
      position: relative;
      z-index: 3;
    }

    .deck-shell.is-video-cover .deck-brand {
      color: rgba(230, 243, 246, 0.85);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
    }

    .deck-shell.is-video-cover .footer-info {
      color: rgba(168, 213, 221, 0.85);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .deck-shell.is-video-cover .slide-body {
      position: static;
      justify-content: flex-end;
      padding-bottom: clamp(6px, 1.2vh, 14px);
    }

    .intro-video-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050b16;
      z-index: 0;
      pointer-events: none;
    }

    .intro-video-scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        to top,
        rgba(4, 12, 22, 0.86) 0%,
        rgba(4, 12, 22, 0.34) 24%,
        rgba(4, 12, 22, 0.04) 48%,
        rgba(4, 12, 22, 0.38) 100%
      );
    }

    .intro-overlay {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-brand-strip {
      display: inline-flex;
      align-items: center;
      gap: clamp(14px, 1.8vw, 24px);
      padding: 10px 24px;
      border-radius: 999px;
      background: rgba(5, 16, 26, 0.56);
      border: 1px solid rgba(168, 213, 221, 0.34);
      backdrop-filter: blur(10px);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }

    .intro-brand-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(1.25rem, 1.9vw, 1.95rem);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.02em;
    }

    .intro-brand-item img.intro-logo-sync {
      width: clamp(34px, 2.8vw, 44px);
      height: clamp(34px, 2.8vw, 44px);
      object-fit: contain;
      display: block;
    }

    .intro-brand-sep {
      font-size: clamp(1.2rem, 1.8vw, 1.8rem);
      font-weight: 700;
      color: #a8d5dd;
      opacity: 0.85;
    }

    .vc-slide-pictorica-mini {
      position: relative;
      width: clamp(48px, 3.8vw, 62px);
      aspect-ratio: 10 / 6.7;
      overflow: hidden;
      background: #ffffff;
      border: 1.5px solid rgba(42, 127, 142, 0.5);
      border-radius: 11px;
      box-shadow: 0 10px 26px rgba(15, 76, 92, 0.22);
      flex-shrink: 0;
    }
    .vc-slide-pictorica-mini img {
      position: absolute;
      top: -2%;
      left: 50%;
      width: 178%;
      max-width: none;
      height: auto;
      transform: translateX(-50%);
      display: block;
    }
    .intro-print-fallback {
      display: none;
    }

    @media (max-width: 960px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .deck-shell { width: 100%; height: auto; min-height: 100vh; overflow: visible; }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .deck-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(0.95rem, 1.15vw, 1.2rem);
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .deck-brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      display: block;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    /* Em tela cheia no projetor, oculta botões auxiliares para maximizar área de leitura */
    .deck-shell:fullscreen .top-actions,
    .deck-shell:-webkit-full-screen .top-actions {
      opacity: 0.12;
      transition: opacity 0.2s ease;
    }
    .deck-shell:fullscreen .top-actions:hover,
    .deck-shell:-webkit-full-screen .top-actions:hover {
      opacity: 1;
    }

    .tool-btn {
      background: var(--btn-sec-bg);
      border: 1px solid var(--border);
      color: var(--btn-sec-text);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tool-btn:hover { filter: brightness(1.08); }

    .slide-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(14px, 1.8vh, 24px);
      animation: fadeSlide 0.22s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-tag {
      display: inline-block;
      align-self: flex-start;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: clamp(0.95rem, 1.22vw, 1.25rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: var(--tag-bg);
      color: var(--tag-color);
    }

    /* Tipografia ampliada e nítida para leitura a até 20 fileiras de distância em retroprojetor */
    .slide-title {
      font-size: clamp(2.35rem, 4.3vw, 4.35rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .slide-lead {
      font-size: clamp(1.32rem, 2.05vw, 2.15rem);
      line-height: 1.36;
      color: var(--text-soft);
      max-width: 100%;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(16px, 1.8vw, 26px);
      align-items: stretch;
    }

    .routine-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(16px, 1.8vw, 26px);
      align-items: start;
    }

    .routine-column {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: clamp(10px, 1.4vh, 16px);
      min-width: 0;
    }

    .routine-visual {
      display: block;
      width: auto;
      height: clamp(180px, 29vh, 310px);
      max-width: 100%;
      align-self: center;
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .slide-body:has(.demo-grid) { justify-content: flex-start; gap: clamp(10px, 1.35vh, 18px); }
    .slide-body:has(.demo-grid) > .slide-title { flex: 0 0 auto; }

    .demo-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.38fr);
      gap: clamp(16px, 1.8vw, 24px);
      align-items: stretch;
      min-height: 0;
      flex: 1;
    }
    .demo-grid > .card,
    .demo-grid > .video-frame { min-height: 0; }
    .demo-grid > .card { justify-content: center; }
    .demo-grid .video-frame video {
      min-height: 0;
      height: min(62vh, 680px);
      max-height: none;
    }
    .demo-video-poster {
      display: none;
      width: 100%;
      height: min(62vh, 680px);
      object-fit: contain;
      background: #041015;
    }
    .video-frame.erro-video .demo-video-poster { display: block; }
    .video-frame.erro-video video { display: none; }

    .demo-steps {
      list-style: none;
      padding: 0;
      margin: 4px 0 0;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.2vh, 14px);
    }

    .demo-steps li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: clamp(1.02rem, 1.32vw, 1.34rem);
      line-height: 1.32;
      color: var(--text-soft);
    }

    .demo-step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--bar-primaria);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .video-frame {
      background: var(--card-bg-strong);
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .video-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(15, 76, 92, 0.86);
      color: #e6f3f6;
      font-size: clamp(0.86rem, 1.05vw, 1.05rem);
      font-weight: 700;
    }

    .video-bar-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .video-bar button {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(168, 213, 221, 0.55);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .video-bar button:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .video-frame video {
      width: 100%;
      flex: 1;
      min-height: 320px;
      max-height: 66vh;
      object-fit: contain;
      background: #041015;
      display: block;
      cursor: pointer;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px, 1.6vw, 24px);
      align-items: stretch;
    }

    @media (max-width: 820px) {
      .grid-2, .grid-3, .demo-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-left: 7px solid var(--bar-primaria);
      border-radius: 14px;
      padding: clamp(18px, 2vw, 28px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card.destaque {
      background: var(--card-bg-strong);
      border-left-color: var(--bar-destaque);
    }

    .card.alerta {
      border-left-color: var(--bar-alerta);
    }

    .card h3 {
      font-size: clamp(1.3rem, 1.85vw, 1.9rem);
      line-height: 1.2;
      color: var(--text-primary);
    }

    .card p, .card li {
      font-size: clamp(1.12rem, 1.52vw, 1.56rem);
      line-height: 1.38;
      color: var(--text-soft);
    }

    .card ul {
      padding-left: 24px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .hero-cover {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: center;
    }

    .cover-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 26px;
      border-radius: 18px;
      border: 1.5px solid var(--border);
      background: var(--card-bg-strong);
      text-align: center;
    }

    /* Replica o enquadramento branco arredondado usado para o logo na landing page. */
    .vc-slide-pictorica {
      position: relative;
      width: clamp(140px, 13.5vw, 198px);
      aspect-ratio: 10 / 6.7;
      overflow: hidden;
      background: #ffffff;
      border: 1.5px solid rgba(42, 127, 142, 0.5);
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(15, 76, 92, 0.22);
    }

    .vc-slide-pictorica img {
      position: absolute;
      top: -2%;
      left: 50%;
      width: 178%;
      max-width: none;
      height: auto;
      transform: translateX(-50%);
      display: block;
    }
    .cover-badge strong {
      font-size: clamp(1.3rem, 1.7vw, 1.7rem);
      color: var(--text-primary);
    }

    .cover-badge span {
      font-size: clamp(1rem, 1.2vw, 1.2rem);
      font-weight: 700;
      color: var(--text-muted);
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid rgba(168, 213, 221, 0.45);
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(1rem, 1.2vw, 1.2rem);
    }

    .cta-link.sec {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border-color: var(--border);
    }

    .cta-link:hover { filter: brightness(1.08); }

    .closing-grid { width: min(100%, 1280px); }

    .qr-box {
      background: #ffffff;
      color: #0f4c5c;
      border: 3px solid #2a7f8e;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      min-width: 248px;
    }

    .qr-box img {
      width: clamp(190px, 16vw, 240px);
      height: clamp(190px, 16vw, 240px);
      display: block;
      border-radius: 6px;
    }

    /* A legenda deixa explícito que o QR Code abre o piloto publicado. */
    .qr-legenda {
      max-width: 24ch;
      color: #0f4c5c;
      font-size: clamp(0.95rem, 1.3vw, 1.15rem);
      font-weight: 700;
      line-height: 1.3;
    }

    /* O último slide mantém somente o agradecimento e o QR Code, sem chamada extra. */
    .qr-agradecimento {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      justify-items: center;
      gap: clamp(24px, 5vw, 72px);
      width: min(100%, 1100px);
      margin-inline: auto;
    }

    .deck-shell:has(.qr-agradecimento) .deck-brand { visibility: hidden; }
    /* A marca SYNC ganha destaque acima do agradecimento no fechamento. */
    .qr-marca-fechamento {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.5vh, 16px);
    }
    .qr-marca-fechamento img {
      display: block;
      width: clamp(132px, 17vw, 220px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.2));
    }
    .qr-agradecimento .slide-title { text-align: center; }
    .qr-agradecimento .qr-box { min-width: 0; padding: 12px; }
    .qr-agradecimento .qr-box img {
      width: clamp(180px, 28vw, 280px);
      height: auto; aspect-ratio: 1;
    }

    @media (max-width: 820px) {
      .qr-agradecimento { grid-template-columns: 1fr; }
      .qr-agradecimento .slide-title { font-size: clamp(2rem, 8vw, 3.2rem); }
    }

    .nota-rodape {
      font-size: clamp(1rem, 1.24vw, 1.26rem);
      line-height: 1.38;
      color: var(--text-muted);
    }

    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .footer-info {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-right: auto;
    }

    .nav-btn {
      padding: 6px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Modo impressão 16:9 limpo sem bordas largas para exportar PDF da E5 (Ctrl+P -> Salvar como PDF) */
    .print-deck { display: none; }

    @media print {
      @page { size: 16in 9in; margin: 0; }
      body { background: #ffffff; padding: 0; display: block; width: auto; height: auto; overflow: visible; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .deck-shell { display: none !important; }
      .print-deck { display: block; }
      /* Na exportação PDF da E5, exibe a capa estática da SYNC e o cartão com link no lugar dos vídeos. */
      .print-deck .video-frame,
      .print-deck .intro-video-bg,
      .print-deck .intro-video-scrim,
      .print-deck .intro-overlay { display: none !important; }
      .print-deck .intro-print-fallback {
        display: flex !important;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
      }
      .print-deck .intro-print-fallback img {
        width: 260px;
        height: auto;
        object-fit: contain;
      }
      .print-slide {
        width: 100vw;
        height: 100vh;
        page-break-after: always;
        background: var(--slide-bg-print);
        color: var(--text-primary);
        padding: 26px 36px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
      }
      .print-slide:last-child { page-break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="deck-shell" id="deckRoot">
    <div class="top-bar">
      <span class="deck-brand">
        <img src="../abertura/imagens/LogoOficial.webp" width="44" height="44" alt="Logo oficial SYNC" />
        <span>Time SYNC · VisionChef — Insumo vencendo na cozinha</span>
      </span>
      <div class="top-actions">
        <button class="tool-btn" id="themeBtn" onclick="toggleTheme()" title="Alternar tema Claro/Escuro (T)">☀️ Claro</button>
        <button class="tool-btn" onclick="window.print()" title="Exportar slides em PDF (Ctrl+P)">Exportar PDF</button>
        <button class="tool-btn" onclick="toggleFullscreen()" title="Tela cheia (F)">⛶ Tela cheia</button>
      </div>
    </div>

    <main id="slideMount" class="slide-body"></main>

    <div class="footer-bar">
      <span class="footer-info" id="slideCounter">Slide 1 de 10 • Setas ← →</span>
      <button class="nav-btn" id="prevBtn">← Anterior</button>
      <button class="nav-btn" id="nextBtn">Próximo →</button>
    </div>

  <!-- Container usado apenas na impressão/exportação para PDF (1 slide por página 16:9) -->

    let index = 0;

    function ativarFallbackDemo() {
      // Mantém a composição do slide e usa a prévia local no mesmo quadro do vídeo.
      document.getElementById('demoVideoFrame')?.classList.add('erro-video');
    }

    function atualizarBotaoPausaDemo() {
      const video = document.getElementById('demoVideo');
      const botao = document.getElementById('demoPauseBtn');
      if (!video || !botao) return;
      botao.textContent = video.paused ? '▶ Continuar' : '⏸ Pausar';
    }

    function alternarPausaDemoVideo() {
      const video = document.getElementById('demoVideo');
      if (!video) return;
      if (video.paused) video.play?.().catch(() => {});
      else video.pause();
      atualizarBotaoPausaDemo();
    }

    function reiniciarDemoVideo() {
      const video = document.getElementById('demoVideo');
      if (!video) return;
      video.currentTime = 0;
      video.play?.().catch(() => {});
      atualizarBotaoPausaDemo();
    }

    function render() {
      const atual = slides[index];
      document.getElementById('deckRoot').classList.toggle('is-video-cover', Boolean(atual.videoCover));
      document.getElementById('slideMount').innerHTML = atual.html;
      document.getElementById('slideCounter').textContent = `Slide ${index + 1} de ${slides.length} • Setas ← →`;
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === slides.length - 1;
      // Garante que vídeos de abertura (Slide 1) e demonstração (Slide 7) iniciem do 00:00 automaticamente.
      document.querySelectorAll('#slideMount video').forEach((video) => {
        video.currentTime = 0;
        video.play?.().catch(() => {});
        if (video.id === 'demoVideo') {
          video.addEventListener('play', atualizarBotaoPausaDemo);
          video.addEventListener('pause', atualizarBotaoPausaDemo);
          atualizarBotaoPausaDemo();
        }
      });
    }

    function buildPrintDeck() {
      const marcaTopo = `<div class="deck-brand" style="margin-bottom: 6px;"><img src="../abertura/imagens/LogoOficial.webp" width="40" height="40" alt="" /><span>Time SYNC · VisionChef</span></div>`;
      document.getElementById('printDeck').innerHTML = slides
        .map((s) => `<section class="print-slide">${s.html.includes('class="qr-agradecimento"') ? '' : marcaTopo}${s.html}</section>`)
        .join('');
    }

    function next() { if (index < slides.length - 1) { index += 1; render(); } }
    function prev() { if (index > 0) { index -= 1; render(); } }

    function toggleTheme() {
      const html = document.documentElement;
      const nextTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nextTheme);
      document.getElementById('themeBtn').textContent = nextTheme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
    }

    function toggleFullscreen() {
      const root = document.getElementById('deckRoot');
      if (!document.fullscreenElement) root.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    document.getElementById('prevBtn').addEventListener('click', prev);
    document.getElementById('nextBtn').addEventListener('click', next);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') prev();
      if (e.key.toLowerCase() === 'f') toggleFullscreen();
      if (e.key.toLowerCase() === 't') toggleTheme();
    });

    buildPrintDeck();
    render();
  </script>
