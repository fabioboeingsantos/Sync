<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitch E4 — VisionChef · Time SYNC</title>
  <link rel="icon" type="image/png" sizes="128x128" href="../abertura/imagens/coruja-sync-icone.png" />
  <style>
    /* =========================================================================
       SLIDES DO PITCH (E4) — TIME SYNC · VISIONCHEF
       - Identidade visual alinhada à Paleta Oficial Aço Inox (style-guide.md)
       - Tipografia Arial em alto contraste para retroprojetor e exportação PDF 16:9
       ========================================================================= */
    :root {
      --font-main: Arial, Helvetica, sans-serif;
      --aco-primaria: #0f4c5c;
      --aco-secundaria: #2a7f8e;
      --aco-destaque: #a8d5dd;
      --aco-fundo: #f4f6f7;
      --aco-alerta: #b3261e;
    }

    [data-theme="dark"] {
      --bg-outer: #041015;
      --slide-bg: linear-gradient(155deg, #081c24 0%, #0d2b36 55%, #071920 100%);
      --slide-bg-print: #091f28;
      --card-bg: rgba(15, 76, 92, 0.28);
      --card-bg-strong: rgba(15, 76, 92, 0.48);
      --text-primary: #ffffff;
      --text-soft: #e6f3f6;
      --text-muted: #a8d5dd;
      --border: rgba(168, 213, 221, 0.28);
      --tag-bg: rgba(168, 213, 221, 0.16);
      --tag-color: #a8d5dd;
      --bar-primaria: #2a7f8e;
      --bar-destaque: #a8d5dd;
      --bar-alerta: #f87171;
      --btn-bg: linear-gradient(160deg, rgba(42, 127, 142, 0.9) 0%, rgba(15, 76, 92, 0.96) 100%);
      --btn-text: #ffffff;
      --btn-sec-bg: rgba(255, 255, 255, 0.1);
      --btn-sec-text: #e6f3f6;
    }

    [data-theme="light"] {
      --bg-outer: #dce6e9;
      --slide-bg: #f4f6f7;
      --slide-bg-print: #f4f6f7;
      --card-bg: #ffffff;
      --card-bg-strong: #e6f3f6;
      --text-primary: #0f4c5c;
      --text-soft: #182327;
      --text-muted: #2a7f8e;
      --border: #b8d4da;
      --tag-bg: #a8d5dd;
      --tag-color: #182327;
      --bar-primaria: #0f4c5c;
      --bar-destaque: #2a7f8e;
      --bar-alerta: #b3261e;
      --btn-bg: linear-gradient(160deg, #2a7f8e 0%, #0f4c5c 100%);
      --btn-text: #ffffff;
      --btn-sec-bg: #ffffff;
      --btn-sec-text: #0f4c5c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      background: var(--bg-outer);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* Moldura 16:9 para projetor e gravação do vídeo de 3 minutos */
    .deck-shell {
      width: 100%;
      max-width: 1440px;
      aspect-ratio: 16 / 9;
      background: var(--slide-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.42);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(22px, 2.8vw, 42px);
      overflow: hidden;
    }

    @media (max-width: 960px) {
      .deck-shell { aspect-ratio: auto; min-height: 85vh; }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .deck-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .deck-brand img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .tool-btn {
      background: var(--btn-sec-bg);
      border: 1px solid var(--border);
      color: var(--btn-sec-text);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tool-btn:hover { filter: brightness(1.08); }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(14px, 1.7vw, 22px);
      animation: fadeSlide 0.22s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-tag {
      display: inline-block;
      align-self: flex-start;
      padding: 5px 13px;
      border-radius: 999px;
      font-size: clamp(0.8rem, 0.95vw, 0.94rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      background: var(--tag-bg);
      color: var(--tag-color);
    }

    .slide-title {
      font-size: clamp(1.85rem, 3.05vw, 3.05rem);
      font-weight: 700;
      line-height: 1.12;
      color: var(--text-primary);
    }

    .slide-lead {
      font-size: clamp(1.08rem, 1.48vw, 1.48rem);
      line-height: 1.42;
      color: var(--text-soft);
      max-width: 980px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    @media (max-width: 820px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 5px solid var(--bar-primaria);
      border-radius: 14px;
      padding: clamp(15px, 1.7vw, 22px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card.destaque {
      background: var(--card-bg-strong);
      border-left-color: var(--bar-destaque);
    }

    .card.alerta {
      border-left-color: var(--bar-alerta);
    }

    .card h3 {
      font-size: clamp(1.06rem, 1.3vw, 1.32rem);
      color: var(--text-primary);
    }

    .card p, .card li {
      font-size: clamp(0.96rem, 1.12vw, 1.14rem);
      line-height: 1.44;
      color: var(--text-soft);
    }

    .card ul {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hero-cover {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: center;
    }

    .cover-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 18px 22px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg-strong);
      text-align: center;
    }

    .cover-badge img {
      width: clamp(68px, 7vw, 96px);
      height: clamp(68px, 7vw, 96px);
      object-fit: contain;
    }

    .cover-badge strong {
      font-size: 1.15rem;
      color: var(--text-primary);
    }

    .cover-badge span {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 18px;
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid rgba(168, 213, 221, 0.45);
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(0.92rem, 1.05vw, 1.05rem);
    }

    .cta-link.sec {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border-color: var(--border);
    }

    .cta-link:hover { filter: brightness(1.08); }

    .closing-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: center;
    }

    .qr-box {
      background: #ffffff;
      color: #0f4c5c;
      border: 2px solid #2a7f8e;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      min-width: 196px;
    }

    .qr-box img {
      width: 164px;
      height: 164px;
      display: block;
      border-radius: 6px;
    }

    .qr-box strong { font-size: 0.92rem; color: #0f4c5c; }
    .qr-box span { font-size: 0.78rem; color: #2a7f8e; word-break: break-all; }

    .nota-rodape {
      font-size: clamp(0.82rem, 0.95vw, 0.95rem);
      color: var(--text-muted);
    }

    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .footer-info {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-right: auto;
    }

    .nav-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Modo impressão 16:9 limpo para exportar PDF da E5 (Ctrl+P -> Salvar como PDF) */
    .print-deck { display: none; }

    @media print {
      @page { size: 16in 9in; margin: 0; }
      body { background: #ffffff; padding: 0; display: block; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .deck-shell { display: none !important; }
      .print-deck { display: block; }
      .print-slide {
        width: 100vw;
        height: 100vh;
        page-break-after: always;
        background: var(--slide-bg-print);
        color: var(--text-primary);
        padding: 46px 56px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }
      .print-slide:last-child { page-break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="deck-shell" id="deckRoot">
    <div class="top-bar">

        <img src="../abertura/imagens/coruja-sync-icone.png" width="28" height="28" alt="" />

      <div class="top-actions">

        <button class="tool-btn" onclick="toggleFullscreen()" title="Tela cheia (F)">⛶ Tela cheia</button>

      <button class="nav-btn" id="prevBtn">← Anterior</button>

  <!-- Container usado apenas na impressão/exportação para PDF (1 slide por página 16:9) -->
  <div class="print-deck" id="printDeck"></div>

  <script>

    let index = 0;

    function render() {
      document.getElementById('slideMount').innerHTML = slides[index].html;
      document.getElementById('slideCounter').textContent = `Slide ${index + 1} de ${slides.length} • Setas ← →`;
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === slides.length - 1;
    }

    function buildPrintDeck() {
      document.getElementById('printDeck').innerHTML = slides
        .map((s) => `<section class="print-slide">${s.html}</section>`)
        .join('');
    }

    function next() { if (index < slides.length - 1) { index += 1; render(); } }
    function prev() { if (index > 0) { index -= 1; render(); } }

    function toggleTheme() {
      const html = document.documentElement;
      const nextTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nextTheme);
      document.getElementById('themeBtn').textContent = nextTheme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
    }

    function toggleFullscreen() {
      const root = document.getElementById('deckRoot');
      if (!document.fullscreenElement) root.requestFullscreen?.();
      else document.exitFullscreen?.();
    }

    document.getElementById('prevBtn').addEventListener('click', prev);
    document.getElementById('nextBtn').addEventListener('click', next);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') prev();
      if (e.key.toLowerCase() === 'f') toggleFullscreen();
      if (e.key.toLowerCase() === 't') toggleTheme();
    });

    buildPrintDeck();
    render();
  </script>
</body>
</html>
