<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente de estoque por conversa</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf4ef; color: #173328; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 48rem; margin: auto; padding: 2rem 1rem; }
    h1 { margin: .25rem 0 1rem; line-height: 1.1; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.04em; }
    h2 { font-size: 1.2rem; margin: 0 0 .75rem; }
    .project { margin: 0; color: #3b6655; font-weight: 650; }
    .panel { background: white; border: 1px solid #c5d7cd; border-radius: 1.25rem; padding: clamp(1rem, 4vw, 1.75rem); margin-top: 1rem; }
    .messages { max-height: 22rem; overflow: auto; display: grid; gap: .65rem; padding: .2rem; }
    .message { margin: 0; width: fit-content; max-width: 88%; padding: .65rem .9rem; border-radius: .9rem; background: #edf4ef; overflow-wrap: anywhere; }
    .user { justify-self: end; background: #164f3c; color: white; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
    button { cursor: pointer; color: #164f3c; background: white; border: 1px solid #83a797; border-radius: .65rem; font: inherit; padding: .45rem .75rem; min-height: 2.75rem; }
    .primary { background: #164f3c; border-color: #164f3c; color: white; }
    button:disabled { opacity: .6; cursor: default; }
    :focus-visible { outline: 3px solid #26764f; outline-offset: 3px; }
    input { width: 100%; min-width: 0; border: 1px solid #83a797; border-radius: .6rem; padding: .55rem; font: inherit; }
    label { display: block; font-weight: 600; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .7rem; }
    .feedback { min-height: 1.5em; margin: .5rem 0 0; }
    #lots { padding-inline-start: 1.25rem; margin-bottom: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p class="project">Insumo vencendo na cozinha</p>
    <h1>Assistente de estoque</h1>
    <section class="panel" aria-label="Conversa com o assistente">
      <div class="messages" id="messages" role="log" aria-label="Mensagens" tabindex="0">
        <p class="message">Qual lote você quer cadastrar? Informe o insumo, o código do lote e a data de validade.</p>
      </div>
      <div class="actions" aria-label="Exemplos">
        <button type="button" id="complete-example">Testar lote completo</button>
        <button type="button" id="partial-example">Testar data ambígua</button>
      </div>
      <form id="conversation">
        <label for="message">Sua mensagem</label>
        <input id="message" maxlength="400" autocomplete="off" placeholder="Ex.: Queijo, lote B02, validade 30/11/2026" required>
        <div class="actions">
          <button class="primary">Enviar</button>
          <button type="button" id="voice">Ditar mensagem</button>
          <button type="button" id="reset">Recomeçar</button>
        </div>
        <p class="feedback" id="voice-status" role="status"></p>
      </form>
    </section>
    <section class="panel" id="review" hidden>
      <h2>Revise o lote antes de salvar</h2>
      <form id="lot-form">
        <div class="fields">
          <label>Insumo <input id="item" maxlength="100" required></label>
          <label>Lote <input id="code" maxlength="40" required></label>
          <label>Validade <input type="date" id="expiry" min="1900-01-01" max="9999-12-31" required></label>
        </div>
        <div class="actions"><button class="primary">Salvar lote</button></div>
      </form>
    </section>
    <section class="panel" aria-labelledby="lots-heading">
      <h2 id="lots-heading">Lotes deste teste</h2>
      <p id="empty">Nenhum lote salvo.</p>
      <ul id="lots"></ul>
      <p class="feedback" id="storage-status" role="status"></p>
    </section>
  </main>
  <script src="assistente-ia-conversa.js" defer></script>
</body>
</html>
